# Words the TTS model cannot guess.
#
# The rules in thai_normalize.py cover anything systematic — numbers, times,
# dates, decimals, percentages. This file covers the rest: things where the
# only way to know the pronunciation is to be told.
#
# Add entries freely; this is meant to grow. Matching is longest-first and
# case-insensitive, and ASCII keys match on word boundaries, so "no" will not
# fire inside "node".
#
# When adding an entry, say it out loud first. The goal is what a Thai speaker
# would actually say, not a letter-by-letter transliteration.

